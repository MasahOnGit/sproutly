<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sproutly Smart Plant Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/plant-illustration.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<div class="background-decor decor-a"></div>
<div class="background-decor decor-b"></div>
<div class="background-decor decor-c"></div>

<header class="app-header">
  <div class="brand-wrap">
    <div class="brand-mark" aria-label="Sproutly logo">
      <span class="leaf leaf-left"></span>
      <span class="leaf leaf-right"></span>
      <span class="stem"></span>
    </div>
    <div>
      <p class="eyebrow">Smart plant tracker</p>
      <h1>Sproutly</h1>
    </div>
  </div>

  <div class="header-actions">
    <div id="modeBadge" class="mode-badge">Guest</div>
    <button id="themeToggle" class="icon-button" aria-label="Toggle theme">☼</button>
    <button id="logoutBtn" class="ghost-button hidden">Logout</button>
  </div>
</header>

<main id="main-content">
  <section id="welcomeScreen" class="screen screen-active"></section>
  <section id="dashboardScreen" class="screen"></section>
</main>

<script type="module" src="./js/app.js"></script>
</body>
</html>
